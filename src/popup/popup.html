<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt SpeedySlate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-title">
        <span class="logo-icon">⚡</span>
        <h1>SpeedySlate</h1>
      </div>
      <span class="badge">v1.0</span>
    </header>

    <!-- SECTION 1: OCR MODEL MANAGEMENT -->
    <section class="card">
      <div class="card-title">
        <span>📦 Model OCR Cục Bộ (0đ Chi Phí)</span>
      </div>
      <div class="form-group">
        <label for="ocr-model-select">Chọn gói mô hình:</label>
        <select id="ocr-model-select"></select>
      </div>
      <div class="model-status-box">
        <div class="status-row">
          <span>Trạng thái:</span>
          <span id="model-status-badge" class="status-badge">Đang kiểm tra...</span>
        </div>
        <div id="progress-container" class="progress-bar-container" style="display: none;">
          <div id="progress-bar" class="progress-bar-fill"></div>
          <span id="progress-text" class="progress-text">0%</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="btn-download-model" class="btn btn-primary">⬇ Tải Model Về Máy</button>
        <button id="btn-delete-model" class="btn btn-danger" style="display: none;">🗑 Xóa Model</button>
      </div>
    </section>

    <!-- SECTION 2: TRANSLATION API -->
    <section class="card">
      <div class="card-title">
        <span>🔑 Cấu Hình API Dịch Thuật</span>
      </div>

      <div class="form-group">
        <label for="provider-select">Nhà cung cấp (Preset):</label>
        <select id="provider-select"></select>
      </div>

      <div class="form-group" id="group-base-url">
        <label for="input-base-url">Base URL:</label>
        <input type="text" id="input-base-url" placeholder="https://api.groq.com/openai/v1">
      </div>

      <div class="form-group">
        <label for="select-model">Tên Model (Điền sẵn hoặc tự gõ):</label>
        <div class="combobox-wrapper">
          <select id="select-model-preset"></select>
          <input type="text" id="input-custom-model" placeholder="Nhập tên model..." style="margin-top: 6px;">
        </div>
      </div>

      <div class="form-group" id="group-api-key">
        <label for="input-api-key">API Key:</label>
        <input type="password" id="input-api-key" placeholder="Nhập API Key...">
      </div>

      <div class="test-row">
        <button id="btn-test-connection" class="btn btn-secondary">⚡ Kiểm Tra Kết Nối</button>
        <span id="test-result" class="test-result-text"></span>
      </div>
    </section>

    <!-- SECTION 3: DISPLAY & READING -->
    <section class="card">
      <div class="card-title">
        <span>🎨 Tùy Chọn Hiển Thị & Cuộn</span>
      </div>
      <div class="form-row">
        <div class="form-group half">
          <label for="select-theme">Màu hộp thoại:</label>
          <select id="select-theme">
            <option value="light">Nền Trắng (Chữ Đen)</option>
            <option value="dark">Nền Đen (Chữ Trắng)</option>
            <option value="auto">Tự động nhận diện</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="input-speed">Tốc độ cuộn:</label>
          <input type="number" id="input-speed" min="1" max="10" value="3">
        </div>
      </div>
    </section>

    <!-- SAVE FOOTER -->
    <footer class="footer">
      <button id="btn-save-settings" class="btn btn-success">💾 Lưu Cài Đặt</button>
      <span id="save-status" class="save-status"></span>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
