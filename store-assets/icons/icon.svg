<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Obsidian Slate Container Gradient -->
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191B26" />
      <stop offset="52%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>

    <linearGradient id="slateRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5460" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#2E3244" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#E52E3D" stop-opacity="0.4" />
    </linearGradient>

    <!-- Back Raw Manga Card Gradient -->
    <linearGradient id="rawCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2E42" />
      <stop offset="100%" stop-color="#1A1D2B" />
    </linearGradient>

    <!-- Foreground Crimson Speech Balloon Gradient -->
    <linearGradient id="crimsonBubble" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FF4B57" />
      <stop offset="48%" stop-color="#E52E3D" />
      <stop offset="100%" stop-color="#B31322" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltWhite" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE8EA" />
    </linearGradient>

    <!-- Manga Halftone Pattern -->
    <pattern id="halftone" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <circle cx="6" cy="6" r="2.6" fill="#FF3B47" opacity="0.16" />
    </pattern>

    <clipPath id="squircleClip">
      <rect x="20" y="20" width="472" height="472" rx="108" />
    </clipPath>
  </defs>

  <!-- 1. Squircle Base -->
  <g clip-path="url(#squircleClip)">
    <rect x="20" y="20" width="472" height="472" fill="url(#slateBg)" />

    <!-- Subtle Manga Halftone Accents in Corners -->
    <circle cx="430" cy="88" r="145" fill="url(#halftone)" />
    <circle cx="84" cy="432" r="125" fill="url(#halftone)" />

    <!-- Diagonal Manga Speedlines -->
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="3" stroke-linecap="round">
      <line x1="350" y1="30" x2="480" y2="-40" />
      <line x1="395" y1="55" x2="505" y2="-5" />
      <line x1="40" y1="455" x2="145" y2="395" />
    </g>

    <!-- Soft Crimson Ambient Glow -->
    <circle cx="290" cy="278" r="155" fill="#E52E3D" opacity="0.22" />
  </g>

  <!-- Outer Crisp Rim -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="url(#slateRim)" stroke-width="4" />

  <!-- 2. Back Layer: Raw Manga Panel Slate (文) -->
  <g transform="translate(178, 178) rotate(-8)">
    <!-- Brutalist Ink Offset -->
    <rect x="-102" y="-92" width="196" height="172" rx="34" fill="#050609" opacity="0.75" transform="translate(6, 10)" />
    <!-- Panel Body -->
    <rect x="-102" y="-92" width="196" height="172" rx="34" fill="url(#rawCard)" stroke="#555B7A" stroke-width="5" />
    <!-- Stylized CJK '文' (Text/Script) Glyph -->
    <g stroke="#B8C0DF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(-22, -10)">
      <line x1="0" y1="-44" x2="0" y2="-28" />
      <line x1="-42" y1="-26" x2="42" y2="-26" />
      <path d="M 24,-26 C 18,4 -4,26 -38,40" />
      <path d="M -22,-18 C -6,6 14,26 38,40" />
    </g>
  </g>

  <!-- 3. Foreground Layer: Translated Comic Speech Balloon + Speed Bolt -->
  <g transform="translate(20, 14)">
    <!-- Comic Brutalist Hard Shadow -->
    <path d="M 282,118
             C 374,118 436,170 436,248
             C 436,326 374,380 282,380
             C 246,380 214,372 188,358
             L 124,404
             C 112,412 100,401 106,387
             L 132,324
             C 129,301 128,275 128,248
             C 128,170 190,118 282,118 Z"
          fill="#050508" transform="translate(10, 14)" />

    <!-- Crimson Speech Balloon -->
    <path d="M 282,118
             C 374,118 436,170 436,248
             C 436,326 374,380 282,380
             C 246,380 214,372 188,358
             L 124,404
             C 112,412 100,401 106,387
             L 132,324
             C 129,301 128,275 128,248
             C 128,170 190,118 282,118 Z"
          fill="url(#crimsonBubble)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />

    <!-- Top Specular Comic Highlight Arc -->
    <path d="M 176,174 C 202,144 242,134 290,134"
          fill="none" stroke="#FF9AA2" stroke-width="7" stroke-linecap="round" opacity="0.65" />

    <!-- Central High-Voltage Speed Bolt (Brutalist Ink Offset + Crisp White) -->
    <polygon points="306,152 214,258 274,258 248,348 350,234 288,234"
             fill="#6E0712" transform="translate(6, 8)" />
    <polygon points="306,152 214,258 274,258 248,348 350,234 288,234"
             fill="url(#boltWhite)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

    <!-- Golden-Amber Spark Star -->
    <path d="M 382,172 L 388,186 L 402,192 L 388,198 L 382,212 L 376,198 L 362,192 L 376,186 Z"
          fill="#FFD166" />
  </g>
</svg>
