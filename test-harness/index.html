<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>SpeedySlate OCR Test Harness</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #14161a; color: #e8e8e8; }
  #controls { position: sticky; top: 0; z-index: 100; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: #1d2027; border-bottom: 1px solid #333; }
  select, button, label { font-size: 13px; }
  select { background: #2a2e38; color: #e8e8e8; border: 1px solid #444; border-radius: 6px; padding: 5px 8px; }
  button { background: #3b82f6; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
  button:disabled { background: #444; cursor: default; }
  button.secondary { background: #374151; }
  #status { font-size: 12px; color: #9ca3af; }
  #summary { padding: 8px 16px; font-size: 12px; color: #6ee7b7; white-space: pre-wrap; }
  .img-card { margin: 18px; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .img-head { display: flex; gap: 14px; align-items: center; padding: 8px 12px; background: #1d2027; font-size: 13px; }
  .img-head .stat { color: #6ee7b7; font-variant-numeric: tabular-nums; }
  .img-head button { padding: 3px 10px; font-size: 12px; }
  .img-body { display: flex; gap: 0; }
  .stage { position: relative; flex-shrink: 0; }
  .stage img { display: block; max-width: 560px; }
  .stage canvas.boxes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .panel { flex: 1; min-width: 0; padding: 10px; font-size: 12px; background: #181b20; overflow: auto; max-height: 800px; }
  .panel table { width: 100%; border-collapse: collapse; }
  .panel td { border-bottom: 1px solid #262a33; padding: 4px 6px; vertical-align: top; }
  .conf { color: #fbbf24; font-variant-numeric: tabular-nums; }
  .kind { color: #a78bfa; }
  .err { color: #f87171; }
</style>
</head>
<body>
<div id="controls">
  <select id="model-select"></select>
  <label><input type="checkbox" id="use-webgpu" checked /> WebGPU</label>
  <button id="btn-load-model">1. Load Model</button>
  <button id="btn-run-all" disabled>2. Run ALL</button>
  <button id="btn-export" class="secondary" disabled>Export JSON</button>
  <span id="status">idle</span>
</div>
<div id="summary"></div>
<div id="results"></div>
<script type="module" src="./harness.bundle.js"></script>
</body>
</html>
