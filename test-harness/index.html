<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: 'SpeedySlateComic';
      src: url('/fonts/ComicNeue-Bold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
    }
    #stage {
      display: inline-block;
      margin: 0;
      padding: 0;
    }
    .speedyslate-wrapper {
      position: relative;
      display: inline-block;
      margin: 0;
      padding: 0;
      line-height: 0;
    }
    .speedyslate-wrapper img {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
